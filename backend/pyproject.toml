[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "incrementality-api"
version = "0.1.0"
description = "Backend API for the Incrementality and Lift Measurement Suite"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.29,<1.0",
    "alembic>=1.14,<2.0",
    "argon2-cffi>=25.1,<26.0",
    "boto3>=1.43,<2.0",
    "numpy>=2.0,<3.0",
    "statsmodels>=0.14,<1.0",
    "scipy>=1.14,<2.0",
    "pymc>=6.1,<7.0",
    "reportlab>=4.2,<5.0",
]

[project.scripts]
incrementality-worker = "incrementality_api.workers.main:run"

[project.optional-dependencies]
dev = [
    "httpx2>=2.5,<3.0",
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=0.24,<2.0",
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
    "boto3-stubs[s3]>=1.43,<2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--import-mode=importlib",
]

[tool.coverage.run]
branch = true
source = ["incrementality_api"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
packages = ["incrementality_api"]
mypy_path = "src"
